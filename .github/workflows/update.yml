name: Katalog aktualisieren

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: katalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten holen
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python update.py
      - name: Speichern
        run: |
          git config user.name "katalog-bot"
          git config user.email "katalog-bot@users.noreply.github.com"
          git add data/movies.json
          git diff --cached --quiet || git commit -m "Update $(date -u +%F)"
          git push
